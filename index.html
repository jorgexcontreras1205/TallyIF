<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F4EA">
<title>Tally: where I stand at work</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314231C'/%3E%3Cg fill='none' stroke-linecap='round' stroke-width='5'%3E%3Cpath stroke='%23F1F4EA' d='M17 16v32M27 16v32M37 16v32M47 16v32'/%3E%3Cpath stroke='%23FF8A4C' d='M9 43 55 21'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4EA; --panel:#FBFCF6; --ink:#14231C; --muted:#54645A; --rule:#C8D2BE; --grid:rgba(40,110,75,.11);
  --signal:#BF4310; --on-signal:#FFFFFF; --done:#1B7568; --on-done:#FFFFFF; --warn:#946008; --bad:#B02A20;
  --cal3:#14231C; --band:#14231C; --band-ink:#F1F4EA; --band-muted:#A9B8AC; --band-signal:#FF9257;
  --shadow:0 18px 50px rgba(20,35,28,.22);
  --body:"Barlow","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111915; --panel:#18221D; --ink:#E5EBE1; --muted:#9AA99E; --rule:#2D3B33; --grid:rgba(120,200,160,.07);
    --signal:#FF8A4C; --on-signal:#1A0D05; --done:#52C2B1; --on-done:#06211D; --warn:#E3B04B; --bad:#FF8478;
    --cal3:#06211D; --band:#1E2B24; --band-ink:#EEF3EA; --band-muted:#9FB0A4; --band-signal:#FF9A63;
    --shadow:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111915; --panel:#18221D; --ink:#E5EBE1; --muted:#9AA99E; --rule:#2D3B33; --grid:rgba(120,200,160,.07);
  --signal:#FF8A4C; --on-signal:#1A0D05; --done:#52C2B1; --on-done:#06211D; --warn:#E3B04B; --bad:#FF8478;
  --cal3:#06211D; --band:#1E2B24; --band-ink:#EEF3EA; --band-muted:#9FB0A4; --band-signal:#FF9A63;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
/* a color chosen in Settings wins over the viewer's light or dark setting */
:root[data-tone="classic"]{--paper:#F1F4EA; --panel:#FBFCF6; --ink:#14231C; --muted:#54645A; --rule:#C8D2BE; --grid:rgba(40,110,75,.11); --signal:#BF4310; --on-signal:#FFFFFF; --done:#1B7568; --on-done:#FFFFFF; --warn:#946008; --bad:#B02A20; --cal3:#14231C; --band:#14231C; --band-ink:#F1F4EA; --band-muted:#A9B8AC; --band-signal:#FF9257; --shadow:0 18px 50px rgba(20,35,28,.22); color-scheme:light;}
:root[data-tone="dark"]{--paper:#111915; --panel:#18221D; --ink:#E5EBE1; --muted:#9AA99E; --rule:#2D3B33; --grid:rgba(120,200,160,.07); --signal:#FF8A4C; --on-signal:#1A0D05; --done:#52C2B1; --on-done:#06211D; --warn:#E3B04B; --bad:#FF8478; --cal3:#06211D; --band:#1E2B24; --band-ink:#EEF3EA; --band-muted:#9FB0A4; --band-signal:#FF9A63; --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark;}
:root[data-tone="warm"]{--paper:#F4E9D2; --panel:#FBF4E4; --ink:#2B1D12; --muted:#6D5A48; --rule:#DCC9A6; --grid:rgba(150,95,30,.12); --signal:#9A3412; --on-signal:#FFFFFF; --done:#2E6B4F; --on-done:#FFFFFF; --warn:#8A5A06; --bad:#A3271C; --cal3:#2B1D12; --band:#2B1D12; --band-ink:#F4E9D2; --band-muted:#C2AE93; --band-signal:#FFB07A; --go:#0F766E; --on-go:#FFFFFF; --shadow:0 18px 50px rgba(43,29,18,.26); color-scheme:light;}
:root[data-tone="tropical"]{--paper:#E8F6F1; --panel:#F6FCFA; --ink:#073B3A; --muted:#3D6763; --rule:#B3DCD2; --grid:rgba(0,150,136,.13); --signal:#C2185B; --on-signal:#FFFFFF; --done:#0B7A50; --on-done:#FFFFFF; --warn:#8F5600; --bad:#B3261E; --cal3:#073B3A; --band:#0A4D4A; --band-ink:#F2FBF7; --band-muted:#A9D6CD; --band-signal:#FFC857; --shadow:0 18px 50px rgba(7,59,58,.26); color-scheme:light;}
:root[data-tone="tech"]{--paper:#070B14; --panel:#0E1524; --ink:#DCE8FF; --muted:#8C9BB8; --rule:#1F2C48; --grid:rgba(0,229,255,.10); --signal:#FF5FD9; --on-signal:#1A0016; --done:#00E5FF; --on-done:#001318; --warn:#FFD166; --bad:#FF6B8B; --cal3:#001318; --band:#101B36; --band-ink:#EAF2FF; --band-muted:#93A4C8; --band-signal:#FF5FD9; --shadow:0 0 0 1px rgba(0,229,255,.28),0 18px 60px rgba(0,229,255,.14); color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{background:transparent;border:1.5px solid var(--ink);border-radius:6px;padding:7px 14px;font-weight:500;line-height:1.3}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.primary:hover{filter:brightness(1.08);background:var(--signal);color:var(--on-signal)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--paper)}
.btn.small{padding:4px 10px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--signal);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted)}
kbd{font:500 12px/1 var(--body);border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.7;margin-left:6px}

/* top bar */
.top{border-bottom:1.5px solid var(--ink)}
.top-a{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px;padding:14px 0 10px}
.mid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.util{justify-self:end}
@media (max-width:620px){.top-a{grid-template-columns:1fr auto}.mid{grid-column:1 / -1;grid-row:2}}
.top-b{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 0 14px;border-top:1px solid var(--rule)}
.util{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.seg.lang button{padding:4px 9px;font-size:14px}
.btn.big{padding:11px 24px;font-size:18px}
.brand-wrap{display:flex;align-items:center;gap:12px}
.help{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:600 16px/1 var(--body);padding:0}
.help:hover{background:var(--ink);color:var(--paper)}
.btn.go{background:var(--go,#F2B705);border-color:var(--go,#F2B705);color:var(--on-go,#14231C);font-weight:600}
.btn.go:hover{background:var(--go,#F2B705);color:var(--on-go,#14231C);filter:brightness(1.07)}
.btn.go.new{padding:9px 22px;font-size:17px;animation:beckon 2.2s ease-out infinite}
@keyframes beckon{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--go,#F2B705) 70%,transparent)}70%,100%{box-shadow:0 0 0 12px transparent}}
@media (prefers-reduced-motion:reduce){.btn.go.new{animation:none}}
.hero{border-top:1.5px solid var(--ink);margin-top:44px}
.shelf{border-top:0;margin-top:0}
.know{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px 64px;padding:38px 0 0}
.know .q{margin-bottom:10px}
.ins li{position:relative;padding:10px 0 10px 22px;border-top:1px solid var(--rule);max-width:70ch}
.ins li:last-child{border-bottom:1px solid var(--rule)}
.ins li::before{content:"";position:absolute;left:2px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.ins .k2::before{background:var(--signal)} .ins .k1::before{background:var(--warn)} .ins .kok::before{background:var(--done)}
.do h3{margin-bottom:10px}
.do{display:grid;gap:8px;align-content:start}
.do-btn{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;line-height:1.35}
.do-btn strong{display:block;font-weight:600;font-size:17px}
.do-btn span{font-size:14.5px;color:var(--muted)}
.do-btn:hover{background:var(--ink);color:var(--paper)} .do-btn:hover span{color:var(--paper)}
.tools{padding:44px 0 0;border-top:1.5px solid var(--ink);margin-top:44px}
.tools .q{margin-bottom:8px}
.gads{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px 64px}
.gad h3{font:600 22px/1.2 var(--cond);padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.g-d{color:var(--muted);font-size:15px;margin:8px 0 12px}
.g-in{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.g-in label span,.g-pick span{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.g-in input,.g-pick select{width:100%;background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:6px 9px;min-width:0}
.g-in input:focus,.g-pick select:focus{outline:2px solid var(--signal);outline-offset:0;border-color:var(--signal)}
.g-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 16px;margin:16px 0 12px}
.g-res dt{font-size:14px;color:var(--muted)}
.g-res dd{font:600 25px/1.15 var(--cond)}
.meter{position:relative;height:10px;border-radius:5px;background:color-mix(in srgb,var(--rule) 70%,var(--paper))}
.meter i{display:block;height:100%;border-radius:5px;background:var(--done)}
.meter.bad i{background:var(--signal)}
.meter b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.chart{display:block;width:100%;height:auto;margin-top:4px}
.chart polyline{fill:none;stroke:var(--signal);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ideal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .ax{stroke:var(--rule);stroke-width:1} .chart .mk{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.g-pick{display:block;margin-bottom:6px}
.g-key{font-size:13.5px;color:var(--muted);margin-top:6px}
.ln{display:inline-block;width:18px;border-top:2.5px solid var(--signal);vertical-align:middle;margin-right:2px}
.ln.ideal{border-top:1.5px dashed var(--muted)}
.g-say{margin-top:6px;font-weight:500}
.renew li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--rule);align-items:baseline}
.renew li:first-child{border-top:0}
.renew .link{text-align:left;color:var(--ink);font-weight:500}
.renew .when{grid-column:1 / -1;font-size:14px;color:var(--muted)}
.renew .meter{grid-column:1 / -1;height:6px;margin-top:4px}
.pd{list-style:decimal;padding-left:22px;margin:6px 0 4px}
.pd li{padding:9px 0;border-top:1px solid var(--rule)}
.pd li:first-child{border-top:0}
.pd li{display:list-item}
.pd li span{display:inline-block;vertical-align:top;max-width:calc(100% - 110px);color:var(--muted);font-size:15px}
.pd li strong{color:var(--ink);font-size:16px;font-weight:600}
.pd li em{float:right;font-style:normal;font-weight:600}
.ghost{position:absolute;left:-9999px;width:10px;height:10px;opacity:0}
.job-acts{flex-wrap:wrap}
@media (max-width:900px){.know{grid-template-columns:1fr}}
.brand{display:flex;align-items:center;gap:8px;font:600 30px/1 var(--cond);letter-spacing:.01em;margin-right:4px}
.brand svg{width:30px;height:28px}
.brand svg path{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;fill:none}
.brand svg .x{stroke:var(--signal)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font-weight:500;font-size:15px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.who{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);min-width:0}
.who select{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px;font-weight:500;max-width:100%;min-width:0}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
/* quick links */
#rail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0 0}
.tab{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 12px 5px 9px;text-decoration:none;font-size:14px;font-weight:500;line-height:1.25}
.tab .ic{width:20px;text-align:center;flex:none;font-size:16px;line-height:1}
.tab .lb{white-space:nowrap}
.tab:hover{border-color:var(--ink)}
.tab.edit{color:var(--muted);border-style:dashed}
.rail-sep{display:none}
@media (min-width:900px){
  #rail{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:20;flex-direction:column;flex-wrap:nowrap;gap:2px;padding:6px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;box-shadow:0 6px 22px rgba(20,35,28,.13)}
  .tab{position:relative;width:38px;height:38px;justify-content:center;gap:0;padding:0;border:0;border-radius:50%;background:transparent}
  .tab:hover,.tab:focus-visible{background:color-mix(in srgb,var(--rule) 65%,transparent)}
  .tab .ic{width:auto;font-size:19px}
  .tab.edit{border:0} .tab.edit .ic{font-size:16px}
  .tab .lb{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);padding:5px 10px;background:var(--ink);color:var(--paper);border-radius:6px;font-size:13.5px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
  .tab:hover .lb,.tab:focus-visible .lb{opacity:1;visibility:visible}
  .rail-sep{display:block;width:22px;height:1px;background:var(--rule);margin:3px 0}
  .wrap{padding-left:60px;padding-right:60px}
}
@media (prefers-reduced-motion:reduce){.tab .lb{transition:none}}
.notice{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px;color:var(--muted)}
.notice strong{color:var(--ink);font-weight:600}

/* hero */
.hero{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-bottom:1.5px solid var(--ink)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px 56px;padding:40px 0 36px;align-items:end}
.hero-line{font:600 clamp(26px,3.4vw,38px)/1.1 var(--cond);letter-spacing:.005em}
.hero-fig{display:block;font:600 clamp(84px,15vw,172px)/.86 var(--cond);letter-spacing:-.01em;margin-bottom:10px;font-variant-numeric:tabular-nums}
.hero-fig .u{font-size:.3em;font-weight:500;margin:0 .32em 0 .1em;letter-spacing:0}
.marks{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:22px;min-height:40px}
.gate{display:block;flex:none}
.gate path{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.gate .x{stroke:var(--signal)}
.draw .gate path{stroke-dasharray:46;stroke-dashoffset:46;animation:draw .26s ease-out forwards;animation-delay:calc(var(--i)*15ms + 120ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw .gate path{animation:none;stroke-dashoffset:0}}
.marks-note{margin-top:8px;font-size:14px;color:var(--muted)}
.hero-side{padding-bottom:4px}
.break{width:100%;border-collapse:collapse;margin-top:14px}
.break th,.break td{padding:9px 0;border-top:1px solid var(--rule);text-align:left;font-weight:400;vertical-align:baseline}
.break td{text-align:right;white-space:nowrap;padding-left:12px}
.break .calc{color:var(--muted);font-size:14px}
.break tr:last-child th,.break tr:last-child td{border-bottom:1px solid var(--rule)}
.break .amt{font-weight:600}
.hero-foot{margin-top:12px;font-size:14px;color:var(--muted)}

/* focus band */
.band{background:var(--band);color:var(--band-ink)}
.band-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:center;padding:30px 0}
.band h2{font:500 17px/1.3 var(--body);color:var(--band-muted);margin-bottom:8px}
.focus-line{font:600 clamp(26px,3.6vw,40px)/1.12 var(--cond);max-width:22em}
.focus-sub{margin-top:10px;max-width:62ch;color:var(--band-ink)}
.focus-more{margin-top:14px;display:grid;gap:4px;color:var(--band-muted);max-width:70ch}
.focus-more b{color:var(--band-ink);font-weight:500}
.focus-more .watch b{color:var(--band-signal)}
.band .btn{border-color:var(--band-ink);color:var(--band-ink)}
.band .btn:hover{background:var(--band-ink);color:var(--band)}

/* sections */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0 64px;padding:44px 0 8px}
.cols.one{grid-template-columns:minmax(0,760px)}
section>h2,.q{font:600 30px/1.1 var(--cond);margin-bottom:18px}
h3{font:600 17px/1.3 var(--body)}
.sub{margin-top:30px}
.sub:first-of-type{margin-top:0}
.sub-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.sub-head .meta{color:var(--muted);font-size:15px}
.sub-head .right{margin-left:auto}
.empty{color:var(--muted);max-width:52ch}

/* check-ins */
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{background:var(--panel);border:1.5px solid var(--rule);border-radius:999px;padding:7px 14px 7px 12px;display:inline-flex;align-items:center;gap:8px;text-align:left;line-height:1.25}
.check::before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:50%;flex:none}
.check:hover{border-color:var(--ink)}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-done)}
.check[aria-pressed="true"]::before{border-color:var(--on-done);background:var(--on-done);box-shadow:inset 0 0 0 3px var(--done)}

/* calendar */
.cal{max-width:348px}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-nav strong{font:600 21px/1.2 var(--cond);min-width:8.2em;text-align:center}
.cal-nav .btn.small{font-size:18px;line-height:1;padding:4px 11px}
.cal-nav .btn:disabled{opacity:.3;cursor:default;background:transparent;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dh{font-size:12.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{height:36px;border-radius:6px;border:1.5px solid transparent;background:color-mix(in srgb,var(--rule) 45%,var(--paper));font-size:14.5px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
button.cday:hover{border-color:var(--muted)}
.cday.wk{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
.cday.l1{background:color-mix(in srgb,var(--done) 24%,var(--paper))}
.cday.l2{background:color-mix(in srgb,var(--done) 48%,var(--paper))}
.cday.l3{background:color-mix(in srgb,var(--done) 74%,var(--paper));color:var(--cal3)}
.cday.l4{background:var(--done);color:var(--on-done)}
.cday.fut{background:transparent;color:color-mix(in srgb,var(--muted) 50%,var(--paper))}
.cday.now{border-color:var(--ink);font-weight:600}
.cday.sel{outline:2px solid var(--signal);outline-offset:1px}
.kp{white-space:nowrap}
.cal-key{margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.6}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-left:4px;background:color-mix(in srgb,var(--rule) 45%,var(--paper));border:1px solid var(--rule)}
.sw.l2{background:color-mix(in srgb,var(--done) 48%,var(--paper));border-color:transparent}
.sw.l4{background:var(--done);border-color:transparent}

/* suggestions */
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;font-size:14px;color:var(--muted)}
.chip{background:transparent;border:1px dashed var(--muted);border-radius:999px;padding:3px 11px;font-size:14px;color:var(--ink)}
.chip::before{content:"+ ";color:var(--signal);font-weight:600}
.chip:hover{border-style:solid;border-color:var(--ink)}

/* numbers */
.nums{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.numb{padding:14px 16px 14px 0;border-bottom:1px solid var(--rule);min-width:0}
.numb:nth-child(odd){border-right:1px solid var(--rule)}
.numb:nth-child(even){padding-left:16px;padding-right:0}
.numb .name{font-weight:500}
.numb .val{font:600 34px/1.05 var(--cond);margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.numb .val .unit{font:500 16px/1 var(--body);color:var(--muted);letter-spacing:0}
.numb .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.numb .state{font-size:14px;margin-top:2px}
.numb .state.ok{color:var(--done)} .numb .state.off{color:var(--signal)}
.numb .acts{display:flex;gap:14px;margin-top:6px;font-size:14px}
.spark{flex:none}
.spark polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

/* plan */
.load{margin:-6px 0 16px;color:var(--muted);max-width:60ch}
.load b{color:var(--ink);font-weight:600}
.load.over b{color:var(--signal)}
.jobs{border-top:1.5px solid var(--ink)}
.job{border-bottom:1px solid var(--rule)}
.job summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 10px;padding:14px 0;align-items:baseline}
.job summary::-webkit-details-marker{display:none}
.job summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);align-self:center;transition:transform .15s}
.job[open] summary::before{transform:rotate(45deg)}
.job .title{font-weight:600;font-size:17px;line-height:1.3}
.job .status{font-weight:600;font-size:15px;white-space:nowrap}
.st-ok{color:var(--done)} .st-tight{color:var(--warn)} .st-bad{color:var(--bad)} .st-done,.st-none{color:var(--muted)}
.job .line{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--muted);font-size:15px}
.bar{flex:1 1 120px;max-width:220px;height:8px;background:color-mix(in srgb,var(--rule) 70%,var(--paper));border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:4px}
.job.is-done .title{color:var(--muted);text-decoration:line-through}
.job-body{padding:0 0 18px 28px}
.steps li{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px dashed var(--rule)}
.steps li:first-child{border-top:0}
.steps label{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0;cursor:pointer}
.steps input[type=checkbox]{width:17px;height:17px;accent-color:var(--done);flex:none;transform:translateY(2px)}
.steps .done-txt{color:var(--muted);text-decoration:line-through}
.steps .h{color:var(--muted);font-size:14px;white-space:nowrap}
.steps .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.steps .x:hover{color:var(--bad)}
.add-step{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.add-step input{background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:6px 10px;min-width:0}
.add-step .t{flex:1 1 180px} .add-step .hh{width:84px}
.job-acts{display:flex;gap:16px;margin-top:12px;font-size:15px}
.below{margin-top:16px}

/* shelf */
.shelf{padding:44px 0 56px;border-top:1.5px solid var(--ink);margin-top:44px}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:8px}
.shelf-head .q{margin-bottom:0}
.shelf-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.shelf-lede{color:var(--muted);max-width:62ch;margin-bottom:22px}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px 40px}
.kind h3{padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.item{border-bottom:1px solid var(--rule)}
.item summary{list-style:none;cursor:pointer;padding:9px 0;font-weight:500;display:flex;gap:8px;align-items:baseline}
.item summary::-webkit-details-marker{display:none}
.item summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400}
.item[open] summary::after{content:"\2212"}
.item-body{padding:0 0 12px;color:var(--ink);white-space:pre-line;font-size:15px;line-height:1.55}
.item-acts{display:flex;gap:16px;margin-top:8px;font-size:14px;white-space:normal}

/* setup */
.setup{max-width:560px;padding:56px 0 72px}
.setup h1{font:600 44px/1.05 var(--cond);margin-bottom:12px}
.setup p{color:var(--muted);margin-bottom:22px;max-width:52ch}

/* dialog + forms */
dialog{border:1.5px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(580px,calc(100vw - 24px));max-height:min(86vh,760px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,15,.55)}
#dlg-body{padding:24px 26px 22px;overflow:auto;max-height:inherit}
dialog h2{font:600 28px/1.1 var(--cond);margin-bottom:14px}
dialog h3{margin:22px 0 6px}
dialog p{margin-bottom:10px}
dialog .hint{color:var(--muted);font-size:15px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-weight:500;font-size:15px;margin-bottom:4px}
.fld input,.fld select,.fld textarea,.txt{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px}
.fld textarea,.txt{min-height:120px;resize:vertical;line-height:1.45}
.txt.tall{min-height:260px;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.txt:focus,.add-step input:focus{outline:2px solid var(--signal);outline-offset:0;border-color:var(--signal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;align-items:end}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.grow{flex:1}
.err{color:var(--bad);min-height:1.2em;margin:4px 0 0;font-size:15px}
.togs{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:6px}
.tog{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tog input{width:17px;height:17px;accent-color:var(--done)}
.lk-row{display:grid;grid-template-columns:54px 1fr 1.5fr auto;gap:8px;margin-bottom:8px}
.lk-row input{background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.lk-ic{text-align:center}
#su-kind,#s-kind{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px}
.tones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.tone{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--rule);border-radius:999px;padding:6px 14px 6px 8px;font-weight:500}
.tone[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tone .dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.28)}
.tone-warm .dot{background:linear-gradient(135deg,#F4E9D2 50%,#9A3412 50%)}
.tone-classic .dot{background:linear-gradient(135deg,#F1F4EA 50%,#1B7568 50%)}
.tone-dark .dot{background:linear-gradient(135deg,#111915 50%,#52C2B1 50%);border-color:rgba(255,255,255,.35)}
.numb .val{white-space:nowrap;overflow-wrap:normal}
.numb .row{flex-wrap:wrap}
.tone-tropical .dot{background:linear-gradient(135deg,#0B6E69 50%,#E0245E 50%)}
.tone-tech .dot{background:linear-gradient(135deg,#070B14 50%,#00E5FF 50%);border-color:rgba(255,255,255,.35)}
:root[data-tone="tech"] .hero-fig{text-shadow:0 0 30px rgba(0,229,255,.38)}
:root[data-tone="tech"] .hero{background-size:32px 32px}
:root[data-tone="tech"] .btn,:root[data-tone="tech"] .seg,:root[data-tone="tech"] .who select,:root[data-tone="tech"] dialog,:root[data-tone="tech"] #tour{border-radius:2px}
:root[data-tone="tech"] .seg button[aria-pressed="true"],:root[data-tone="tech"] .btn:not(.primary):not(.danger):hover{background:var(--done);color:var(--on-done)}
:root[data-tone="tech"] .seg,:root[data-tone="tech"] .seg button+button,:root[data-tone="tech"] .btn:not(.primary):not(.danger),:root[data-tone="tech"] .top,:root[data-tone="tech"] .who select{border-color:var(--done)}
:root[data-tone="tropical"] .hero{background-image:radial-gradient(circle at 92% -10%,rgba(255,200,87,.38),transparent 42%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px}
dialog h3.first{margin-top:0}
.parts{display:grid;gap:8px;margin:6px 0 4px}
.part{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--paper)}
.part input{width:18px;height:18px;margin-top:3px;accent-color:var(--done);flex:none}
.part span{font-size:15px;color:var(--muted);line-height:1.4}
.part strong{color:var(--ink);font-weight:600;font-size:16px}
.part:has(input:checked){border-color:var(--done)}
#wz-kind{width:100%;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px}
#tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:min(440px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow)}
#tour[hidden]{display:none}
#tour h2{font:600 24px/1.15 var(--cond);margin:2px 0 6px}
#tour p{font-size:15.5px;line-height:1.5}
.tour-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.tour-top .x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 2px}
#tour .row-btns{margin-top:12px}
.tour-hl{outline:3px solid var(--signal);outline-offset:6px;border-radius:6px;scroll-margin-top:16px}
.band .tour-hl{outline-color:var(--band-signal)}
#rail.tour-hl{outline-offset:3px}
.chk-row{display:flex;gap:8px;margin-bottom:8px}
.chk-row input{flex:1;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0}
#pal-q{width:100%;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px;font-size:17px}
#pal-res{margin-top:10px;display:grid}
.res{display:flex;gap:10px;align-items:baseline;justify-content:space-between;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 6px}
.res:hover,.res:focus-visible{background:color-mix(in srgb,var(--signal) 12%,transparent)}
.res .k{color:var(--muted);font-size:14px;white-space:nowrap}
.found-body{white-space:pre-line;line-height:1.55;margin:6px 0 14px}

.foot{padding:18px 0 28px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 20px}
.foot .warn{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast,.job summary::before{transition:none}}

@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding:30px 0 28px}
  .band-in{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr;gap:44px 0}
  .top-actions{margin-left:0}
}
@media (max-width:520px){
  .nums{grid-template-columns:1fr}
  .numb,.numb:nth-child(even){padding:14px 0;border-right:0}
  .numb:nth-child(odd){border-right:0}
  .two,.three{grid-template-columns:1fr}
  .lk-row{grid-template-columns:54px 1fr}
  .lk-row .lk-url{grid-column:1 / -1}
  .lk-row .btn{grid-column:1 / -1;justify-self:end}
  .job summary{grid-template-columns:18px minmax(0,1fr)}
  .job .status{grid-column:2}
  .job-body{padding-left:0}
  kbd{display:none}
}

.shelf{border-top:0;margin-top:0}
.hero{border-top:1.5px solid var(--ink);margin-top:44px}

/* ---------- version 6: areas, calendar, goals ---------- */
.tabs{display:flex;gap:2px;margin-top:6px;border-bottom:1px solid var(--rule)}
.tabs[hidden],.tabs.solo{display:none}
.tabb{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:9px 14px;font-weight:500;font-size:16px;color:var(--muted)}
.tabb span{font-size:17px;line-height:1}
.tabb:hover{color:var(--ink)}
.tabb[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--signal);font-weight:600}
.goalt{display:none}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:14px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .q{margin-bottom:0}
.sec>summary::after{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-left:auto;align-self:center;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec[open]>summary{margin-bottom:14px}
.sec-val{font:600 22px/1 var(--cond);color:var(--muted)}
.sec[open] .sec-val{display:none}
.hero .wrap{padding-top:30px;padding-bottom:26px}
.hero-in{padding:6px 0 0}
.shelf-head{align-items:center}
.shelf-head .shelf-lede{margin-bottom:0}
.shelf .sec[open] .shelf-head{margin-bottom:20px}
.cday{position:relative;flex-direction:column;gap:2px;height:40px;cursor:pointer}
button.cday.fut{background:transparent;border:1px solid color-mix(in srgb,var(--rule) 60%,transparent);color:var(--muted)}
.dots{display:flex;gap:2px;height:5px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.dot.dj{background:var(--signal)} .dot.dt{background:var(--warn)} .dot.dh{background:var(--muted)}
.cday.l3 .dot,.cday.l4 .dot{box-shadow:0 0 0 1px var(--panel)}
.cal-key .dot,.coming .dot,.onday .dot{width:8px;height:8px;margin-right:6px;flex:none}
.coming-h{margin-top:20px;margin-bottom:6px}
.coming li{border-top:1px solid var(--rule)} .coming li:last-child{border-bottom:1px solid var(--rule)}
.coming button{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 2px;align-items:baseline}
.coming button:hover{background:color-mix(in srgb,var(--signal) 10%,transparent)}
.coming .when{color:var(--muted);font-size:14.5px}
.tag{font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;white-space:nowrap}
.dl-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dl-nav>div{text-align:center} dialog .dl-nav h2{margin-bottom:2px} .dl-nav .hint{margin:0}
.dl-nav .btn{font-size:20px;line-height:1;padding:7px 14px}
.onday li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid var(--rule)}
.onday li span:nth-child(2){flex:1;min-width:0}
.goals-btn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:14px 18px;margin:30px 0 6px}
.goals-btn:hover{background:color-mix(in srgb,var(--done) 10%,var(--panel))}
.goals-btn .g-ic{font-size:28px;grid-row:1 / 3}
.goals-btn .g-tx{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.goals-btn strong{font:600 22px/1.2 var(--cond)}
.goals-btn .num{color:var(--muted)}
.goals-btn .meter{grid-column:2}
.g-years{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.g-meter{display:flex;align-items:center;gap:12px;margin:4px 0 6px} .g-meter .meter{flex:1} .g-meter .num{color:var(--muted);font-size:15px}
.goals li{padding:12px 0;border-top:1px solid var(--rule)}
.g-row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.g-title{font-weight:500;display:flex;gap:10px;align-items:baseline;cursor:default}
label.g-title{cursor:pointer}
.g-title input{width:18px;height:18px;accent-color:var(--done);flex:none;transform:translateY(3px)}
.g-num{display:flex;align-items:flex-end;gap:10px;margin:8px 0}
.g-num label span{display:block;font-size:13.5px;color:var(--muted)}
.g-num input{width:130px;background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:6px 9px}
.area{padding:34px 0 20px}
.area-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:6px}
.area-head .q{margin-bottom:0}
.area-cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 56px;margin-top:10px}
.lines li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:11px 0;border-top:1px solid var(--rule)}
.lines li:last-child{border-bottom:1px solid var(--rule)}
.lines label{display:flex;align-items:baseline;gap:10px;flex:1 1 220px;min-width:0;cursor:pointer}
.lines input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);flex:none;transform:translateY(3px)}
.lines .when{font-size:14.5px;color:var(--muted)} .lines .when.st-bad{color:var(--bad)}
.done-box{margin-top:16px} .done-box>summary{cursor:pointer;color:var(--muted);padding:6px 0}
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 48px;margin-top:12px}
.trip{border-top:1.5px solid var(--ink);padding-top:12px}
.trip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trip h3{font:600 22px/1.2 var(--cond)} .trip .count{font-weight:600;color:var(--signal);white-space:nowrap}
.trip .when{color:var(--muted);margin:2px 0 8px} .trip .note{font-size:15px;margin-bottom:8px}
.trip .job-acts{align-items:baseline}
.nw-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:12px 0 18px;border-bottom:1.5px solid var(--ink)}
.nw-top strong{font:600 clamp(46px,9vw,78px)/1 var(--cond)}
.nw-top span{color:var(--muted)}
.nw-g{margin-top:22px}
.nw-gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.nw-gh .num{font:600 21px/1 var(--cond)}
.nw-g .lines li{padding:0} .nw-g>.link{display:inline-block;margin-top:10px;font-size:15px} .nw-g>.hint{margin:8px 0 0}
.nw-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 2px}
.nw-row:hover{background:color-mix(in srgb,var(--signal) 10%,transparent)}

.hcol h3 .mic{margin-right:6px}
.verdict{margin:-6px 0 20px;padding:10px 14px;border-radius:0 10px 10px 0;font-weight:500;background:var(--panel);border-left:4px solid var(--muted);max-width:80ch}
.verdict.ok{border-color:var(--done)} .verdict.warn{border-color:var(--warn)} .verdict.bad{border-color:var(--bad);color:var(--bad)}
.cat-row{display:flex;align-items:center;gap:6px}
.cat-row .nw-row{flex:1;min-width:0}
.plus{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;flex:none;padding:0}
.plus:hover{border-color:var(--ink)}
.grp .num{margin-left:auto;color:var(--muted);font-weight:400}
.nw-over{margin-top:30px}
.nwc{max-width:100%}
.nwc polyline{stroke:var(--done);stroke-width:2.5}
.nwc .area{fill:color-mix(in srgb,var(--done) 14%,transparent);stroke:none}
.nwc circle{fill:var(--done);stroke:var(--panel);stroke-width:2}
.nwc .lbl{font:400 12px var(--body);fill:var(--muted)}
.nwc .end{text-anchor:end}
.nwc .val{font:600 16px var(--cond);fill:var(--ink)}
.nwh-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.nwh-row input{background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.lock[hidden]{display:none}
body.locked>*:not(.lock){visibility:hidden}
.lock-in{display:grid;justify-items:center;gap:8px;width:min(320px,100%);text-align:center}
.if-logo.big{width:76px;height:76px}
.lock-in h2{font:600 34px/1 var(--cond);margin:4px 0 0}
.lock-t{color:var(--muted)}
.dots4{display:flex;gap:16px;margin:10px 0 2px}
.dots4 i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink)}
.dots4 i.on{background:var(--ink)}
.lock .err{min-height:1.4em;margin:0}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:12px 18px;margin:4px 0 12px}
.key{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);font:500 26px/1 var(--cond);padding:0}
.key:hover{border-color:var(--ink)}
.key.txt{border:0;background:none;font:500 14px/1.2 var(--body)}
.danger-link{color:var(--bad)}
.lock-btns{margin-top:6px}
@media (max-width:760px){
  .appbar .top-a{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
  .brand{display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:1px;align-items:center;font-size:23px}
  .if-logo{width:32px;height:32px;grid-row:1 / span 2}
  .b-by{font-size:11.5px;padding:0;align-self:start}
  .brand svg{width:20px;height:19px}
  .who{flex:1 1 auto;min-width:0}
  .who-btn{width:100%;justify-content:space-between;min-height:42px}
  .vmenu{width:calc(100vw - 28px);max-height:62vh}
  .orbs{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 6px;margin-top:6px}
  .orb-ball{width:min(22vw,88px);margin-bottom:4px}
  .orb{padding:4px 2px;gap:3px}
  .orb strong{font-size:17px} .orb small{font-size:12.5px}
  .orbs-sec{margin-top:12px;padding-top:2px}
  .orbs-sec .q{margin-bottom:4px}
  .ring{width:34px;height:34px} .ring b{width:26px;height:26px;background:var(--panel);font-size:12.5px}
  .week{margin-top:12px} .wk small{display:none}
  .start{padding-top:8px}
  .start #doing .q{margin-bottom:6px}
  .start #doing>.sub{padding:12px}
  .start .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .start .check{border-radius:12px;padding:7px 10px 7px 9px;min-height:44px;font-size:14px;line-height:1.2;width:100%}
  #calsec{margin-top:14px}
  .tabb{font-size:11px}
  .notice{display:flex;flex-wrap:nowrap;gap:10px}
  .notice>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
  .notice .link{flex:none;white-space:nowrap;min-height:36px}
  .notice{align-items:center;padding:2px 0}
  .wk{padding:5px 0}
  .funpick .btn{flex:1}
  .plus{width:38px;height:38px}
}
</style>
</head>

function backWd(T,n){var d=T;while(n>0){d=addDays(d,-1);if(isWeekday(d))n--}return d}
function seedDays(p,seed,prob,T,roughFrom,roughTo){
  var r=rng(seed);
  for(var i=35;i>=1;i--){
    var d=addDays(T,-i),rough=(i>=roughFrom&&i<=roughTo),o={c:[],l:0,u:0};
    if(isWeekday(d)){
      var missed=rough&&(dow(d)===2||dow(d)===4);
      for(var k=0;k<p.checks.length;k++){if(r()<prob[k]*(rough?.45:1)&&!missed)o.c.push(p.checks[k].id)}
      o.l=1+Math.floor(r()*4);if(rough)o.l=Math.max(1,o.l-1);
      if(dow(d)===5)o.u=1;
    }else if(r()<.1){o.c.push(p.checks[0].id)}
    if(o.c.length||o.l||o.u)p.days[d]=o;
  }
}

/* ---------- calculations ---------- */
function rangeOf(){
  var T=today();
  if(ui.range==='week')return {from:monday(T),to:T};
  if(ui.range==='month')return {from:T.slice(0,8)+'01',to:T};
  return {from:'0000-00-00',to:T};
}
function tally(p,from,to){
  var o={l:0,u:0,d:0};
  Object.keys(p.days).forEach(function(k){
    if(k>=from&&k<=to){var r=p.days[k];o.l+=r.l||0;o.u+=r.u||0;if(r.c&&r.c.length)o.d++}
  });
  o.m=o.l*p.rates.lookup+o.u*p.rates.update+o.d*p.rates.day;
  return o;
}
function streak(p){
  var d=today(),n=0,guard=0;
  if(!rec(p,d).c.length)d=addDays(d,-1);
  while(guard++<2000){
    if(!isWeekday(d)){d=addDays(d,-1);continue}
    if(rec(p,d).c.length){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function jobCalc(j){
  var T=today(),tot=0,doneH=0,doneN=0,next=null;
  j.steps.forEach(function(s){var h=+s.h||0;tot+=h;if(s.done){doneH+=h;doneN++}else if(!next)next=s});
  var c={tot:tot,rem:tot-doneH,n:j.steps.length,doneN:doneN,next:next};
  c.pct=tot?doneH/tot:(c.n?doneN/c.n:0);
  c.complete=c.n>0&&doneN===c.n;
  c.late=j.due<T;
  c.wd=c.late?0:workdays(T,j.due);
  c.need=c.rem/Math.max(c.wd,1);
  if(c.complete){c.key='done';c.label=t('st_done')}
  else if(!c.n){c.key='none';c.label=t('st_none')}
  else if(c.late){c.key='bad';c.label=tn('st_late',daysBetween(j.due,T))}
  else if(c.need<=1.5){c.key='ok';c.label=t('st_ok')}
  else if(c.need<=3){c.key='tight';c.label=t('st_tight')}
  else{c.key='bad';c.label=t('st_behind')}
  c.score=c.complete?-1:(!c.n?0.4:c.need+(c.wd<=3?2:0)+(c.late?5:0));
  return c;
}
/* form: 'l' = a label on its own line, 'p' = the predicate of a sentence */
function dueWords(j,c,form){
  var T=today(),f=form||'l';
  if(j.due===T)return t('due'+f+'_today');
  if(c.late)return t('due'+f+'_late',{date:fmtDay(j.due)});
  return t('due'+f+'_on',{date:fmtDay(j.due),left:tn('wd_left',c.wd)});
}
function numState(n){
  var h=n.hist||[];if(!h.length)return null;
  var v=h[h.length-1].v,tg=+n.target,up=n.better==='up';
  if(isNaN(tg))return {v:v,off:0,ok:true,text:''};
  var gap=Math.round((up?tg-v:v-tg)*100)/100,off=tg?gap/Math.abs(tg):(gap>0?1:0);
  if(gap<=0)return {v:v,off:off,ok:true,text:t(up?'n_ok_up':'n_ok_down',{t:fmtVal(n,tg)})};
  var gt=n.unit==='%'?tn('points',gap):fmtVal(n,gap);
  return {v:v,off:off,ok:false,text:t(up?'n_under':'n_over',{gap:gt,t:fmtVal(n,tg)})};
}
function focusOf(p){
  var open=p.jobs.map(function(j){return {j:j,c:jobCalc(j)}}).filter(function(x){return !x.c.complete});
  open.sort(function(a,b){return b.c.score-a.c.score||(a.j.due<b.j.due?-1:1)});
  var worst=null;
  p.numbers.forEach(function(n){var s=numState(n);if(s&&!s.ok&&s.off>0.05&&(!worst||s.off>worst.s.off))worst={n:n,s:s}});
  return {top:open[0]||null,then:open[1]||null,watch:worst,open:open};
}

function spark(hs,off){
  if(hs.length<2)return '';
  var W=92,H=30,min=Infinity,max=-Infinity;
  hs.forEach(function(x){min=Math.min(min,x.v);max=Math.max(max,x.v)});
  var span=(max-min)||1,pts=hs.map(function(x,i){return (3+i*(W-6)/(hs.length-1)).toFixed(1)+','+(H-4-(x.v-min)/span*(H-8)).toFixed(1)});
  var last=pts[pts.length-1].split(','),col=off?'var(--signal)':'var(--done)';
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline points="'+pts.join(' ')+'" style="stroke:'+col+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" style="fill:'+col+'"/></svg>';
}

/* ---------- weekly update ---------- */
function buildUpdate(p){
  var T=today(),from=addDays(T,-6),o=[],f=focusOf(p);
  o.push(t('up_title',{a:fmtShort(from),b:fmtShort(T)}));
  if(p.name)o.push(p.name+(p.role?', '+p.role:''));
  o.push('');
  var done=[];
  p.jobs.forEach(function(j){var s=j.steps.filter(function(x){return x.done&&x.doneOn&&x.doneOn>=from});if(s.length)done.push('- '+j.title+t('colon')+s.map(function(x){return x.label}).join(t('semi')))});
  o.push(t('up_done'));o.push.apply(o,done.length?done:['- '+t('up_nothing')]);o.push('');
  o.push(t('up_next'));
  if(f.top&&f.top.c.next)o.push('- '+f.top.c.next.label+' ('+f.top.j.title+')');
  if(f.then&&f.then.c.next)o.push('- '+f.then.c.next.label+' ('+f.then.j.title+')');
  if(!f.top)o.push('- '+t('up_no_open'));
  o.push('');
  if(f.open.length){
    o.push(t('up_deadlines'));
    f.open.slice().sort(function(a,b){return a.j.due<b.j.due?-1:1}).forEach(function(x){
      o.push('- '+x.j.title+t('colon')+dueWords(x.j,x.c,'l')+t('semi')+t('pct_done',{n:Math.round(x.c.pct*100)})+t('semi')+x.c.label);
    });
    o.push('');
  }
  if(p.numbers.length){
    o.push(t('up_numbers'));
    p.numbers.forEach(function(n){var s=numState(n);if(s)o.push('- '+n.name+t('colon')+fmtVal(n,s.v)+(s.text?' ('+s.text+')':''))});
    o.push('');
  }
  var got=0,poss=0,d=from;
  while(d<=T){got+=rec(p,d).c.length;if(isWeekday(d))poss+=p.checks.length;d=addDays(d,1)}
  if(p.checks.length)o.push(t('up_checkins',{a:got,b:poss}));
  return o.join('\n').replace(/\n+$/,'');
}
function copyText(text,el){
  function fallback(){try{el.focus();el.select();if(document.execCommand('copy'))return true}catch(e){}return false}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(function(){return true},function(){return fallback()});
  }
  return Promise.resolve(fallback());
}

/* ---------- what should I know: early warnings from the data ---------- */
function pctS(n){return fmtNum(n)+(lang()==='en'?'%':NB+'%')}
function r1(x){return Math.round(x*10)/10}
function doneWds(n){var out=[],d=addDays(today(),-1),g=0;while(out.length<n&&g++<400){if(isWeekday(d))out.push(d);d=addDays(d,-1)}return out}
function insights(p){
  var out=[],T=today(),s=p.show;
  if(s.plan){
    var need=0,due=0,pace=0,from=backWd(T,10);
    p.jobs.forEach(function(j){
      var c=jobCalc(j);
      j.steps.forEach(function(x){if(x.done&&x.doneOn&&x.doneOn>=from)pace+=+x.h||0});
      if(c.complete)return;
      need+=c.need;if(c.late||c.wd<=10)due+=c.rem;
    });
    if(need>p.budget)out.push({k:2,text:t('ins_over',{need:fmtH(need),budget:fmtH(p.budget)})});
    if(due>0&&pace>0&&due>pace*1.15)out.push({k:1,text:t('ins_due',{due:fmtH(due),pace:fmtH(pace)})});
  }
  if(s.nums){
    var nums=[];
    p.numbers.forEach(function(n){
      var h=n.hist||[],tg=+n.target,up=n.better==='up',run=0,st=numState(n);
      for(var i=h.length-1;i>=0;i--){if(up?h[i].v<tg:h[i].v>tg)run++;else break}
      if(run<3||!st)return;
      var a=h[h.length-1].v,b=h[h.length-2].v,better=up?a>b:a<b,worse=up?a<b:a>b;
      nums.push({k:better?1:2,off:st.off+(better?0:10),text:t(up?'ins_num_under':'ins_num_over',{name:n.name,n:run})+(better?' '+t('ins_better'):worse?' '+t('ins_worse'):'')});
    });
    nums.sort(function(a,b){return b.off-a.off});
    out.push.apply(out,nums.slice(0,2));
  }
  if(s.checks&&p.checks.length&&Object.keys(p.days).length>=5){
    var d=doneWds(20),tot=p.checks.length;
    var rate=function(list){var c=0;list.forEach(function(x){c+=rec(p,x).c.length});return Math.round(c/(list.length*tot)*100)};
    var recent=rate(d.slice(0,5)),prev=rate(d.slice(5,10));
    if(prev-recent>=25)out.push({k:1,text:t('ins_drop',{a:pctS(prev),b:pctS(recent)})});
    var worst=null;
    p.checks.forEach(function(c){var n=0;d.forEach(function(x){if(rec(p,x).c.indexOf(c.id)>=0)n++});if(!worst||n<worst.n)worst={c:c,n:n}});
    if(worst&&worst.n/d.length<0.4)out.push({k:0,text:t('ins_least',{label:worst.c.label,n:worst.n,m:d.length})});
  }
  out.sort(function(a,b){return b.k-a.k});
  return out.slice(0,4);
}

/* ---------- plan my day ---------- */
function dayPlan(p){
  var left=p.budget,items=[],guard=0;
  var q=focusOf(p).open.map(function(x){return {j:x.j,steps:x.j.steps.filter(function(s){return !s.done})}}).filter(function(x){return x.steps.length});
  while(left>0.01&&guard++<40){
    var any=false;
    for(var i=0;i<q.length&&left>0.01;i++){
      if(!q[i].steps.length)continue;
      var s=q[i].steps.shift(),full=+s.h||0.5,take=Math.min(full,left);
      items.push({s:s,j:q[i].j,h:take,full:full});left-=take;any=true;
    }
    if(!any)break;
  }
  return items;
}
function planText(p){
  var items=dayPlan(p),T=today(),o=[t('pd_head',{date:fmtDay(T)})];
  items.forEach(function(x,i){o.push((i+1)+'. '+x.s.label+' ('+x.j.title+')'+t('colon')+(x.h<x.full?t('pd_part',{a:fmtH(x.h),b:fmtH(x.full)}):fmtH(x.h)))});
  if(!items.length)o.push(t('pd_none'));
  var open=p.checks.length-rec(p,T).c.length;
  if(p.show.checks&&open>0)o.push(tn('pd_checks',open));
  return o.join('\n');
}

/* ---------- write it for me ---------- */
function buildDaily(p){
  var T=today(),y=doneWds(1)[0],o=[t('dn_title',{date:fmtDay(T)})],done=[];
  p.jobs.forEach(function(j){j.steps.forEach(function(x){if(x.done&&x.doneOn&&x.doneOn>=y)done.push('- '+x.label+' ('+j.title+')')})});
  o.push('',t('dn_yday'));o.push.apply(o,done.length?done:['- '+t('up_nothing')]);
  o.push('',t('dn_today'));
  var items=dayPlan(p).slice(0,4);
  o.push.apply(o,items.length?items.map(function(x){return '- '+x.s.label+' ('+x.j.title+')'}):['- '+t('up_no_open')]);
  o.push('',t('dn_block'));
  var risks=insights(p).filter(function(x){return x.k>0}).slice(0,3);
  o.push.apply(o,risks.length?risks.map(function(x){return '- '+x.text}):['- '+t('dn_none')]);
  return o.join('\n');
}
function buildBrief(p){
  var T=today(),from=addDays(T,-13),o=[t('br_title',{date:fmtDay(T)})],wins=[];
  if(p.name)o.push(p.name+(p.role?', '+p.role:''));
  p.jobs.forEach(function(j){var s=j.steps.filter(function(x){return x.done&&x.doneOn&&x.doneOn>=from});if(s.length)wins.push('- '+j.title+t('colon')+s.map(function(x){return x.label}).join(t('semi')))});
  o.push('',t('br_wins'));o.push.apply(o,wins.length?wins:['- '+t('up_nothing')]);
  o.push('',t('br_risk'));
  var risks=insights(p).filter(function(x){return x.k>0}).slice(0,3);
  o.push.apply(o,risks.length?risks.map(function(x){return '- '+x.text}):['- '+t('dn_none')]);
  o.push('',t('br_help'),'- '+t('br_help_ph'));
  var f=focusOf(p);
  if(f.open.length){o.push('',t('up_deadlines'));f.open.slice().sort(function(a,b){return a.j.due<b.j.due?-1:1}).slice(0,5).forEach(function(x){o.push('- '+x.j.title+t('colon')+dueWords(x.j,x.c,'l')+t('semi')+x.c.label)})}
  return o.join('\n');
}
function writerHTML(kind){
  var p=P(),txt=kind==='daily'?buildDaily(p):kind==='brief'?buildBrief(p):buildUpdate(p);
  return '<h2>'+t('write_me')+'</h2>'+

function lineSVG(series,mark,fit){
  var W=340,H=120,L=6,R=6,Tp=8,B=8,xmax=0,ymax=0,ymin=0;
  series.forEach(function(s){s.pts.forEach(function(q){xmax=Math.max(xmax,q[0]);ymax=Math.max(ymax,q[1]);ymin=Math.min(ymin,q[1])})});
  if(fit){ymin=Infinity;series.forEach(function(s){s.pts.forEach(function(q){ymin=Math.min(ymin,q[1])})});var pad=(ymax-ymin)*0.15||Math.abs(ymax)*0.05||1;ymin-=pad;ymax+=pad}
  xmax=xmax||1;if(ymax===ymin)ymax=ymin+1;
  function X(x){return (L+x/xmax*(W-L-R)).toFixed(1)}
  function Y(y){return (H-B-(y-ymin)/(ymax-ymin)*(H-Tp-B)).toFixed(1)}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-hidden="true"><line class="ax" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';
  if(mark!=null)h+='<line class="mk" x1="'+X(mark)+'" y1="'+Tp+'" x2="'+X(mark)+'" y2="'+(H-B)+'"/>';
  series.forEach(function(s){h+='<polyline class="'+(s.cls||'actual')+'" points="'+s.pts.map(function(q){return X(q[0])+','+Y(q[1])}).join(' ')+'"/>'});
  return h+'</svg>';
}
var CALC={

  }},

function marks(p,ds){
  var o=[];
  p.jobs.forEach(function(j){if(j.due===ds&&!jobCalc(j).complete)o.push({k:'job',title:j.title})});
  p.events.forEach(function(e){if(e.date===ds||(e.yearly&&e.date.slice(5)===ds.slice(5)&&e.date<=ds))o.push({k:e.yearly?'evy':'ev',title:e.title,id:e.id})});
  if(p.show.travel)p.trips.forEach(function(x){if(x.start<=ds&&ds<=x.end)o.push({k:'trip',title:x.name,first:x.start===ds})});
  if(p.show.home)p.home.items.forEach(function(x){if(!x.done&&x.date===ds)o.push({k:'home',title:x.text})});
  ((p.g.renew||{}).items||[]).forEach(function(x){if(x.date===ds)o.push({k:'ren',title:x.label})});
  return o;
}

/* ---------- holidays, company days off and loved ones' dates ---------- */
function nthDow(y,m,dw,n){var d=new Date(y,m,1),off=(dw-d.getDay()+7)%7;return iso(new Date(y,m,1+off+(n-1)*7))}
function lastDow(y,m,dw){var d=new Date(y,m+1,0),off=(d.getDay()-dw+7)%7;return iso(new Date(y,m+1,-off))}
function easter(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return y+'-'+pad(mo)+'-'+pad(da);
}
var HCACHE={};
function holidays(y){
  if(HCACHE[y])return HCACHE[y];
  function f(m,d){return y+'-'+pad(m)+'-'+pad(d)}
  return HCACHE[y]=[['newyear','🥂',f(1,1)],['mlk','🕊️',nthDow(y,0,1,3)],['valentine','💝',f(2,14)],['presidents','🏛️',nthDow(y,1,1,3)],['easter','🐣',easter(y)],
    ['mothers','💐',nthDow(y,4,0,2)],['memorial','🎖️',lastDow(y,4,1)],['juneteenth','✊',f(6,19)],['fathers','👔',nthDow(y,5,0,3)],['july4','🎆',f(7,4)],
    ['labor','🛠️',nthDow(y,8,1,1)],['columbus','🧭',nthDow(y,9,1,2)],['halloween','🎃',f(10,31)],['veterans','🎖️',f(11,11)],['thanksgiving','🦃',nthDow(y,10,4,4)],
    ['xmaseve','🕯️',f(12,24)],['xmas','🎄',f(12,25)],['nye','🎊',f(12,31)]];
}
function holidayOn(ds){var l=holidays(+ds.slice(0,4));for(var i=0;i<l.length;i++)if(l[i][2]===ds)return l[i];return null}
var OFFD={};
function buildOff(){
  OFFD={};var p=P();if(!p)return;var y=new Date().getFullYear();
  p.events.forEach(function(e){if(e.type!=='company')return;if(e.yearly)[y,y+1].forEach(function(yy){OFFD[yy+e.date.slice(4)]=1});else OFFD[e.date]=1});
}
function workdays(from,to){var n=0,d=from,guard=0;while(d<=to&&guard++<4000){if(isWeekday(d)&&!OFFD[d])n++;d=addDays(d,1)}return n}
function billDue(b,ym){var last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();return ym+'-'+pad(Math.min(Math.max(1,+b.day||1),last))}
function marks(p,ds){
  var o=[],h=p.show.hols!==false?holidayOn(ds):null,ym=ds.slice(0,7);
  if(h)o.push({k:'hol',title:t('hol_'+h[0]),ic:h[1]});
  p.jobs.forEach(function(j){if(j.due===ds&&!jobCalc(j).complete)o.push({k:'job',title:j.title})});
  p.events.forEach(function(e){
    if(!(e.date===ds||(e.yearly&&e.date.slice(5)===ds.slice(5)&&e.date<=ds)))return;
    var ty=e.type||'event';
    o.push({k:ty==='company'?'co':ty==='loved'?'lv':(e.yearly?'evy':'ev'),title:e.title,id:e.id,ic:ty==='company'?'🏢':ty==='loved'?'🎂':''});

/* ---------- budget: this month, debt plan, net worth ---------- */
var BTABS=['month','debt','nw'],BG=['need','want','save'];
function budYm(){return ui.budMonth||today().slice(0,7)}
function budSeed(p){
  if(p.bud.cats.length)return;
  var g=['need','need','need','need','need','want','want','want','save','save'];
  for(var i=1;i<=10;i++)p.bud.cats.push({id:uid(),name:t('dc'+i),grp:g[i-1],plan:0});
  save();
}
function budCalc(p,ym){
  var o={spent:{},tot:0,plan:0,g:{need:0,want:0,save:0}};
  p.bud.tx.forEach(function(x){if(x.d.slice(0,7)===ym){o.spent[x.cat]=(o.spent[x.cat]||0)+(+x.amt||0);o.tot+=+x.amt||0}});
  p.bud.cats.forEach(function(c){o.plan+=+c.plan||0;o.g[BG.indexOf(c.grp)>=0?c.grp:'want']+=+c.plan||0});
  return o;
}
function debtPlan(p){
  var ds=p.nw.debts.filter(function(d){return (+d.value||0)>0}).map(function(d){return {name:d.name,bal:+d.value,apr:+d.apr||0,min:+d.min||0}});
  if(!ds.length)return null;
  var extra=Math.max(0,+p.bud.extra||0),snow=p.bud.method==='snow',months=0,interest=0,order=[];
  function target(){var live=ds.filter(function(d){return d.bal>0.005});live.sort(function(a,b){return snow?a.bal-b.bal:(b.apr-a.apr||a.bal-b.bal)});return live[0]}
  while(ds.some(function(d){return d.bal>0.005})&&months<720){
    months++;var pool=extra;
    ds.forEach(function(d){if(d.bal<=0.005)return;var i=d.bal*d.apr/1200;interest+=i;d.bal+=i;var pay=Math.min(d.bal,d.min);d.bal-=pay;pool+=d.min-pay});
    var guard=0;while(pool>0.005&&guard++<50){var tg=target();if(!tg)break;var pay=Math.min(tg.bal,pool);tg.bal-=pay;pool-=pay}
    ds.forEach(function(d){if(d.bal<=0.005&&!d.gone){d.gone=1;order.push({name:d.name,m:months});extra+=d.min}});
  }
  return {months:months,interest:interest,order:order,never:months>=720};
}

/* ---------- net worth history: a chart you can correct ---------- */
function nwChart(keys,hist){
  var W=640,H=200,PL=10,PR=10,PT=26,PB=28,vals=keys.map(function(k){return hist[k]}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),pad=(mx-mn)*0.15||Math.abs(mx)*0.05||1;
  mn-=pad;mx+=pad;
  function X(i){return PL+(keys.length>1?i/(keys.length-1):0.5)*(W-PL-PR)}
  function Y(v){return H-PB-(v-mn)/(mx-mn)*(H-PT-PB)}
  function lab(k){return L[lang()].mon[+k.slice(5,7)-1]+' '+k.slice(0,4)}
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}),last=keys.length-1;
  return '<svg class="chart nwc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('nw_chart')+'"><polygon class="area" points="'+X(0).toFixed(1)+','+(H-PB)+' '+pts.join(' ')+' '+X(last).toFixed(1)+','+(H-PB)+'"/>'+
    '<line class="ax" x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'"/><polyline points="'+pts.join(' ')+'"/>'+
    vals.map(function(v,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===last?5:3.5)+'"><title>'+lab(keys[i])+t('colon')+money0(v)+'</title></circle>'}).join('')+
    '<text class="lbl" x="'+PL+'" y="'+(H-8)+'">'+lab(keys[0])+'</text><text class="lbl end" x="'+(W-PR)+'" y="'+(H-8)+'">'+lab(keys[last])+'</text>'+
    '<text class="val end" x="'+(W-PR)+'" y="'+Math.max(16,Y(vals[last])-12).toFixed(1)+'">'+money0(vals[last])+'</text></svg>';
}

/* ---------- lock: a PIN, and Face ID or Touch ID where the device offers it ---------- */
var LK={mode:'',pin:'',first:'',msg:''};
function hashPin(pin,salt){
  var s=salt+':'+pin;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
  }
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return Promise.resolve('d'+(h>>>0).toString(16));
}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
function unb64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function bioOK(){return topLevel()&&!!window.PublicKeyCredential&&!!navigator.credentials&&window.isSecureContext!==false&&!!(window.crypto&&crypto.getRandomValues)}
function hasPin(){return !!(state.lock&&state.lock.hash)}
function renderLock(){
  var box=$('#lock'),unlock=LK.mode==='unlock';
  var title=unlock?t('lock_enter'):LK.mode==='set2'?t('lock_again'):t('lock_new'),keys='';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){keys+='<button class="key" data-act="pin-key" data-n="'+n+'">'+n+'</button>'});
  keys+=(unlock?'<span></span>':'<button class="key txt" data-act="pin-cancel">'+t('lock_cancel')+'</button>')+'<button class="key" data-act="pin-key" data-n="0">0</button><button class="key txt" data-act="pin-back" aria-label="'+t('lock_del')+'">⌫</button>';
  box.innerHTML='<div class="lock-in"><img class="if-logo big" src="'+IFLOGO+'" alt=""><h2>Tally</h2><p class="lock-t" id="lock-t">'+title+'</p>'+
    '<div class="dots4" aria-hidden="true">'+[0,1,2,3].map(function(i){return '<i'+(i<LK.pin.length?' class="on"':'')+'></i>'}).join('')+'</div>'+
    '<p class="err" role="alert">'+esc(LK.msg)+'</p><div class="keypad">'+keys+'</div>'+
    (unlock&&state.lock.cred&&bioOK()?'<button class="btn" data-act="bio-unlock">'+t('lock_bio')+'</button>':'')+
    (unlock?'<button class="link quiet" data-act="pin-forgot">'+t('lock_forgot')+'</button>':'')+'</div>';
  box.hidden=false;document.body.classList.add('locked');
}
function lockOpen(mode){LK.mode=mode;LK.pin='';LK.first='';LK.msg='';renderLock()}
function lockClose(){LK.mode='';$('#lock').hidden=true;$('#lock').innerHTML='';document.body.classList.remove('locked')}
function lockNow(){if(!hasPin())return;closeDlg();if(ui.tour)tourEnd();ui.locked=true;$('#main').innerHTML='';lockOpen('unlock')}
function unlocked(){ui.locked=false;lockClose();render()}
function pinDone(){
  var pin=LK.pin;
  if(LK.mode==='unlock'){
    hashPin(pin,state.lock.salt).then(function(h){if(h===state.lock.hash)unlocked();else{LK.pin='';LK.msg=t('lock_wrong');renderLock()}});
  }else if(LK.mode==='set1'){LK.first=pin;LK.pin='';LK.mode='set2';LK.msg='';renderLock()}
  else if(LK.mode==='set2'){
    if(pin!==LK.first){LK.mode='set1';LK.pin='';LK.first='';LK.msg=t('lock_mismatch');renderLock();return}
    var salt=uid()+uid();
    hashPin(pin,salt).then(function(h){state.lock={salt:salt,hash:h,cred:(state.lock&&state.lock.cred)||''};save();lockClose();render();toast(t('t_lock_on'))});
  }
}
function bioUnlock(){
  if(!state.lock||!state.lock.cred||!bioOK())return;
  navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(state.lock.cred),transports:['internal']}],userVerification:'required',timeout:60000}})
    .then(function(a){if(a)unlocked()}).catch(function(){if(LK.mode==='unlock'){LK.msg=t('lock_bio_fail');renderLock()}});
}
function bioEnroll(){
  navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Tally'},user:{id:rnd(16),name:'Tally',displayName:'Tally'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}})
    .then(function(c){state.lock.cred=b64(c.rawId);save();if(dlg.open)openDlg(settingsHTML());toast(t('t_bio_on'))})
    .catch(function(){toast(t('lock_bio_fail'))});
}
function lockSettingsHTML(){
  var h='<h3>'+t('lock_h')+'</h3><p class="hint">'+t('lock_hint')+'</p><div class="row-btns lock-btns">';
  if(!hasPin())h+='<button class="btn" data-act="pin-set">'+t('lock_set')+'</button>';
  else{
    h+='<button class="btn" data-act="pin-set">'+t('lock_change')+'</button><button class="btn" data-act="pin-off">'+t('lock_off')+'</button><button class="btn" data-act="lock-now">'+t('lock_now')+'</button>';
    if(bioOK())h+='<button class="btn" data-act="'+(state.lock.cred?'bio-off':'bio-on')+'">'+t(state.lock.cred?'lock_bio_off':'lock_bio_on')+'</button>';
  }
  return h+'</div>';
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.who'))whoClose();
  var lk=e.target.closest('#rail a');if(lk){setTimeout(function(){lk.blur()},0);return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var fn=act[el.getAttribute('data-act')];if(fn)fn(el,e);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='pal-q'){renderPal(el.value);return}
  if(el.getAttribute&&el.getAttribute('data-hnotes')){P().home.notes=el.value;P().touched=true;save();return}
  var id=el.getAttribute&&el.getAttribute('data-g'),p=P();
  if(!id||!p||!CALC[id])return;
  (p.g[id]=p.g[id]||{})[el.getAttribute('data-k')]=el.value===''?null:parseFloat(el.value);
  save();$('#go-'+id).innerHTML=gOut(p,id);
});
document.addEventListener('change',function(e){
  if(e.target.getAttribute('data-burn')){var bp=P();bp.g.burn={job:e.target.value};save();$('#go-burn').innerHTML=burnHTML(bp);return}
  if(e.target.getAttribute('data-gcur')){var g=findGoal(e.target.getAttribute('data-gcur'));if(g){g.cur=parseFloat(e.target.value)||0;touch();openGoals();renderGoalsBtn()}return}
  if(e.target.getAttribute('data-gtheme')){var gp=P();gp.goals.years[goalYear(gp)].theme=e.target.value.trim();touch();renderGoalsBtn();return}
  if(e.target.classList&&(e.target.classList.contains('lk-url')||e.target.classList.contains('lk-lb'))){
    var lr=e.target.closest('.lk-row'),lb=$('.lk-ic',lr);
    if(!lb.getAttribute('data-set')){var gi=guessIcon($('.lk-url',lr).value,$('.lk-lb',lr).value);if(gi!=='🔗'||lb.textContent==='🔗')lb.textContent=gi}
    return;
  }
  if(e.target.getAttribute('data-hols')){P().show.hols=e.target.checked;touch();render();return}
  if(e.target.getAttribute('data-bud')){var bb=P().bud,bk=e.target.getAttribute('data-bud');bb[bk]=bk==='extra'?Math.max(0,parseFloat(e.target.value)||0):e.target.value;touch();renderWorth();return}
  if(e.target.getAttribute('data-pass')){P().travel.passport=e.target.value;touch();renderTravel();return}
  if(e.target.id==='bk-input'){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var fr=new FileReader();
    fr.onload=function(){
      var o=null;try{o=normalize(JSON.parse(fr.result))}catch(x){o=null}
      if(!o){$('#s-err').style.color='';$('#s-err').textContent=t('e_backup');return}
      state=o;save();closeDlg();resetView();render();toast(t('t_restored'));
    };
    fr.readAsText(file);return;
  }
  if(e.target.id!=='who')return;
  state.active=e.target.value;save();resetView();render();
});
document.addEventListener('keydown',function(e){
  var el=e.target,tag=el&&el.tagName,typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  if(LK.mode){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();act['pin-key']({getAttribute:function(){return e.key}})}
    else if(e.key==='Backspace'){e.preventDefault();act['pin-back']()}
    else if(e.key==='Escape'&&LK.mode!=='unlock')act['pin-cancel']();
    return;
  }
  if(e.key==='Escape')whoClose();
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){if(P()&&P().show.shelf){e.preventDefault();act.find()}return}
  if(ui.tour&&!dlg.open&&!typing){
    if(e.key==='Escape'){tourEnd();return}
    if(e.key==='ArrowRight'){e.preventDefault();act['tour-next']();return}
    if(e.key==='ArrowLeft'){e.preventDefault();act['tour-prev']();return}
  }
  if(e.key==='/'&&!dlg.open&&!typing&&P()&&P().show.shelf){e.preventDefault();act.find();return}
  if(e.key==='Enter'&&tag==='INPUT'){
    if(el.id==='pal-q'){var first=$('#pal-res .res');if(first){e.preventDefault();first.click()}return}
    var en=el.getAttribute('data-enter');
    if(en&&act[en]){e.preventDefault();act[en](el,e)}
  }
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d||d.tagName!=='DETAILS')return;
  var job=d.getAttribute('data-job'),item=d.getAttribute('data-item'),sc=d.getAttribute('data-sec');
  if(sc)ui.sec[sc]=d.open;
  if(job){if(d.open)ui.openJobs[job]=true;else delete ui.openJobs[job]}
  if(item){if(d.open){var was=ui.openShelf[item];ui.openShelf[item]=true;if(!was)logLookup(item)}else delete ui.openShelf[item]}
},true);

init();
if(ui.locked){lockOpen('unlock');applyChrome();if(state.lock.cred)setTimeout(bioUnlock,300)}else render();
})();
